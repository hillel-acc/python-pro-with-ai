server {
    listen 80;

    # Serve static SPA files from the root
    location / {
        root /app;
        index index.html;
        try_files $uri $uri/ /index.html; # Redirects non-file routes to index.html for the SPA
    }

    # Proxy API requests to the Python backend container
    location /api/v1 {
        proxy_pass http://backend:8000; # 'backend' is the service name in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
